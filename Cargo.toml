[package]
authors = ["Kevin Lewi <klewi@fb.com>", "François Garillot <fga@fb.com>"]
categories = ["no-std"]
description = "An implementation of the OPAQUE password-authenticated key exchange protocol"
edition = "2024"
exclude = ["/src/tests/"]
keywords = ["cryptography", "crypto", "opaque", "passwords", "authentication"]
license = "Apache-2.0 OR MIT"
name = "opaque-ke"
readme = "README.md"
repository = "https://github.com/facebook/opaque-ke"
rust-version = "1.88"
version = "5.0.0-pre.0"

[features]
argon2 = ["dep:argon2"]
curve25519 = ["dep:curve25519-dalek"]
default = ["ristretto255", "serde"]
ecdsa = ["dep:ecdsa"]
ed25519 = ["dep:curve25519-dalek", "dep:ed25519-dalek"]
kem = ["dep:ml-kem"]
ristretto255 = ["dep:curve25519-dalek", "voprf/ristretto255-ciphersuite"]
serde = [
  "dep:serde",
  "curve25519-dalek?/serde",
  "ecdsa?/serde",
  "ed25519-dalek?/serde",
  "elliptic-curve/serde",
  "generic-array/serde",
  "hybrid-array/serde",
  "voprf/serde",
  "zeroize/serde",
]
std = ["rand/std"]

[dependencies]
argon2 = { version = "0.6", default-features = false, features = [
  "alloc",
], optional = true }
curve25519-dalek = { version = "5", default-features = false, features = [
  "zeroize",
], optional = true }
derive-where = { version = "1.4", features = ["zeroize-on-drop"] }
digest = "0.11"
displaydoc = { version = "0.2", default-features = false }
ecdsa = { version = "0.17", default-features = false, features = [
  "algorithm",
], optional = true }
ed25519-dalek = { version = "3", default-features = false, features = [
  "digest",
  "hazmat",
], optional = true }
elliptic-curve = { version = "0.14.3", features = ["sec1"] }
generic-array = { version = "1", features = ["hybrid-array-0_4", "zeroize"] }
hkdf = "0.13"
hmac = "0.13"
hybrid-array = "0.4"
ml-kem = { version = "0.3.0-rc.0", default-features = false, features = [
  "zeroize",
], optional = true }
rand = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }
subtle = { version = "2.6", default-features = false }
voprf = { version = "0.6.0-pre.2", default-features = false, features = [
  "danger",
] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
anyhow = "1"
bincode = "1"
chacha20poly1305 = "0.11"
criterion = "0.8"
cryptoki = "0.12.1"
elliptic-curve = { version = "0.14", features = ["alloc", "pkcs8"] }
hex = "0.4"
p256 = { version = "0.14", default-features = false, features = [
  "ecdsa",
  "pkcs8",
  "oprf",
] }
p384 = { version = "0.14", default-features = false, features = [
  "pkcs8",
  "oprf",
] }
p521 = { version = "0.14", default-features = false, features = [
  "pkcs8",
  "oprf",
] }
paste = "1"
proptest = "1"
rand = "0.10"
rand_chacha = "0.10"
regex = "1"
sha2 = { version = "0.11", default-features = false }
thiserror = "2"
# MSRV
rustyline = "17"
scrypt = "0.12"
serde_json = "1"

[[bench]]
harness = false
name = "opaque"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = []

[[example]]
name = "simple_login"
required-features = ["argon2"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test_hsm)'] }
